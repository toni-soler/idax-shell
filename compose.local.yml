name: idax-open-core-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: idax
      POSTGRES_USER: idax_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30

  core-migrations:
    build: ../idax-core-runtime
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        exec flyway
        -url=jdbc:postgresql://postgres:5432/idax
        -user=idax_admin
        -password="$$(cat /run/secrets/postgres_password)"
        -connectRetries=60
        -schemas=idax_core
        -table=flyway_schema_history_idax_core
        migrate
    secrets: [postgres_password]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]

  shell:
    build:
      context: .
      args:
        IDAX_CORE_REPOSITORY_URL: ${IDAX_CORE_REPOSITORY_URL:-https://toni-soler.github.io/idax-core-runtime/maven2}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/idax
      DATABASE_USER: idax_admin
      JWT_ISSUER: http://localhost:8088
      IDAX_LOCAL_DEMO_ENABLED: "true"
      IDAX_LOCAL_DEMO_EMAIL: ${IDAX_LOCAL_DEMO_EMAIL:-admin@local.test}
      IDAX_LOCAL_DEMO_PASSWORD: ${IDAX_LOCAL_DEMO_PASSWORD:-IdaxLocal123!}
    secrets: [postgres_password, jwt_private_key, jwt_public_key, bootstrap_token]
    depends_on:
      core-migrations: { condition: service_completed_successfully }
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30

  ledger:
    build: ../idax-ledger/backend
    ports: ["8094:8094"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/idax
      SPRING_DATASOURCE_USERNAME: idax_admin
      SPRING_DATASOURCE_PASSWORD: ${IDAX_LOCAL_DB_PASSWORD:-idax-local-only}
      IDAX_LEDGER_AUTH_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
      IDAX_SERVICE_AUTH_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
      IDAX_LEDGER_PRIVATE_ENABLED: "false"
    secrets: [jwt_public_key]
    depends_on:
      core-migrations: { condition: service_completed_successfully }
    networks: [edge, data]

  ledger-ui:
    build: ../idax-ledger/frontend
    networks: [edge]

  ostris:
    build: ../ostris/backend
    ports: ["8095:8095"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/idax
      SPRING_DATASOURCE_USERNAME: idax_admin
      SPRING_DATASOURCE_PASSWORD: ${IDAX_LOCAL_DB_PASSWORD:-idax-local-only}
      OSTRIS_BACKEND_PORT: "8095"
      IDAX_AUTH_MODE: LOCAL
      IDAX_AUTH_TOKEN_VALIDATOR: local
      IDAX_AUTH_LOCAL_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public_key
      OSTRIS_LEDGER_ENABLED: "false"
    secrets: [jwt_public_key]
    depends_on:
      core-migrations: { condition: service_completed_successfully }
    networks: [edge, data]

  ostris-ui:
    build: ../ostris/frontend
    networks: [edge]

  proxy:
    image: caddy:2.9-alpine
    volumes:
      - ./deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    ports: ["8088:8088"]
    depends_on:
      shell: { condition: service_healthy }
      ledger-ui: { condition: service_started }
      ostris-ui: { condition: service_started }
    networks: [edge]

networks:
  edge: {}
  data: { internal: true }

volumes:
  postgres_data: {}

secrets:
  postgres_password: { file: ./.local/secrets/postgres_password }
  jwt_private_key: { file: ./.local/secrets/jwt_private_key }
  jwt_public_key: { file: ./.local/secrets/jwt_public_key }
  bootstrap_token: { file: ./.local/secrets/bootstrap_token }
