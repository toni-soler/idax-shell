name: ci
on: [push, pull_request]
permissions: {contents: read}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan Git history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a git /repo --config=/repo/.gitleaks.toml --redact --verbose
      - name: Scan working tree
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a dir /repo --config=/repo/.gitleaks.toml --redact --verbose
  build:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21", cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: mvn -B verify
      - run: python -m unittest discover -s tools/tests -v
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: docker compose config
        env: {IDAX_HOSTNAME: example.invalid}
      - name: Exposure scan
        run: |
          ! grep -RInE 'C:\\Users\\|/workspace/' \
            --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules \
            --exclude=ci.yml --exclude=public_promote.py .
