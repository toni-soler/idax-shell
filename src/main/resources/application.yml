spring:
  config.import: optional:configtree:/run/secrets/
  application.name: idax-shell
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/idax}
    username: ${DATABASE_USER:idax_shell}
    password: ${DATABASE_PASSWORD:${postgres_password:}}
  flyway:
    enabled: true
    locations: classpath:db/migration-idax-shell
    schemas: idax_shell
    table: flyway_schema_history_idax_shell
    create-schemas: true
  security.oauth2.resourceserver.jwt.public-key-location: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt_public_key}
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
server.forward-headers-strategy: framework
idax:
  shell:
    jwt:
      private-key: ${JWT_PRIVATE_KEY:file:/run/secrets/jwt_private_key}
      public-key: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt_public_key}
      issuer: ${JWT_ISSUER:https://localhost}
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    bootstrap-token-file: ${BOOTSTRAP_TOKEN_FILE:/run/secrets/bootstrap_token}
    extension-manifest: ${EXTENSION_MANIFEST:classpath:extensions.json}
