spring:
  config.import: optional:configtree:/run/secrets/
  application.name: idax-shell
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/idax}
    username: ${DATABASE_USER:idax_shell}
    password: ${DATABASE_PASSWORD:${postgres_password:}}
  flyway:
    enabled: true
    locations: classpath:db/migration-idax-shell
    schemas: idax_shell
    table: flyway_schema_history_idax_shell
    create-schemas: true
management.endpoints.web.exposure.include: health,info
management.endpoint.health.probes.enabled: true
server.forward-headers-strategy: framework
idax:
  shell:
    bootstrap-token-file: ${BOOTSTRAP_TOKEN_FILE:/run/secrets/bootstrap_token}
    extension-manifest: ${EXTENSION_MANIFEST:classpath:extensions.json}
    local-demo:
      enabled: ${IDAX_LOCAL_DEMO_ENABLED:false}
      email: ${IDAX_LOCAL_DEMO_EMAIL:admin@local.test}
      password: ${IDAX_LOCAL_DEMO_PASSWORD:IdaxLocal123!}
      display-name: ${IDAX_LOCAL_DEMO_DISPLAY_NAME:Local Administrator}
      tenant-code: ${IDAX_LOCAL_DEMO_TENANT_CODE:demo}
      tenant-name: ${IDAX_LOCAL_DEMO_TENANT_NAME:IDAX Demo}
  auth:
    mode: ${IDAX_AUTH_MODE:LOCAL}
    token-validator: ${IDAX_AUTH_TOKEN_VALIDATOR:local}
    local:
      public-key-location: ${JWT_PUBLIC_KEY:file:/run/secrets/jwt_public_key}
      private-key-location: ${JWT_PRIVATE_KEY:file:/run/secrets/jwt_private_key}
  admin:
    user: ${IDAX_LOCAL_DEMO_EMAIL:admin@local.test}
    pass: ${IDAX_LOCAL_DEMO_PASSWORD:IdaxLocal123!}
  break-glass.legacy-runtime-sync.enabled: false
